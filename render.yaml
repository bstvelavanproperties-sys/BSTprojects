services:
  - type: web
    name: bst-velavan-api
    runtime: node
    # Paid tier: the instance stays warm (no cold starts) and the service gets
    # static outbound IPs, which is what lets Atlas be locked to those instead of
    # being opened to the whole internet.
    plan: starter

    # The repo is an npm-workspaces monorepo; this service is only the server
    # workspace, so install and start both run inside server/. The @bstv/shared
    # dependency is declared as `file:../shared`, which npm links from the cloned
    # repo — that is why shared/ does not need publishing anywhere.
    rootDir: server

    # API ONLY. The site itself is built and served by Vercel (see
    # client/vercel.json), so this service no longer runs a build — it does not
    # produce or serve client/dist. That also means devDependencies (vite, tailwind)
    # are not needed here, which is why --include=dev is gone.
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # ---------------------------------------------------------------------
      # REQUIRED. server/src/config/env.js refuses to start without every one of these,
      # rather than booting into a state that is silently insecure or serves demo
      # data as real. A deploy missing one fails fast with a readable list in the
      # Render log instead of coming up subtly wrong.
      # ---------------------------------------------------------------------
      - key: MONGODB_URI
        sync: false

      # Admin sign-in. Must be at least 12 characters and not a known/default
      # password — /admin is named in robots.txt and gets scanned within hours of a
      # domain going live.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Signs admin session tokens. Render generates a strong value automatically.
      # Do NOT leave this unset: auth.js would fall back to deriving the key from
      # your admin password, which turns any leaked token into an offline crack of
      # that password. Rotating it signs everyone out — the intended panic button.
      - key: SESSION_SECRET
        generateValue: true

      # Public address of the SITE — the Vercel/custom domain, NOT this service.
      # Drives canonical URLs, share previews and sitemap.xml.
      - key: SITE_ORIGIN
        sync: false

      # Browser origins allowed to call this API. This is now a real access-control
      # boundary, because the frontend lives on a different origin than this service.
      # Comma-separated, no trailing slashes, e.g.
      #   https://bstvelavan.com,https://www.bstvelavan.com
      # Add the Vercel preview domain too if you test against previews.
      - key: CLIENT_ORIGIN
        sync: false

      # ---------------------------------------------------------------------
      # OPTIONAL. Absent is fine; HALF-configured is rejected at boot.
      # ---------------------------------------------------------------------
      # Cloudinary uploads. Server-side only — the secret never reaches the browser,
      # and each upload is signed per request behind the admin login. Read at
      # runtime, so changing these needs a restart, not a rebuild.
      #
      # Also set a max file size in the Cloudinary console (Settings → Upload). The
      # upload API has no max_file_size parameter, so that console setting is the
      # only real ceiling — see the note in server/src/lib/uploads.js.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

